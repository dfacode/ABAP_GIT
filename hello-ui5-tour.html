<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World – OpenUI5 + Driver.js</title>

  <!-- Driver.js (licença MIT) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/driver.js@1.3.1/dist/driver.css">
  <script src="https://cdn.jsdelivr.net/npm/driver.js@1.3.1/dist/driver.js.iife.js"></script>

  <!-- OpenUI5 1.120 (LTS) a partir do CDN oficial -->
  <script id="sap-ui-bootstrap"
          src="https://sapui5.hana.ondemand.com/resources/sap-ui-core.js"
          data-sap-ui-theme="sap_horizon"
          data-sap-ui-libs="sap.m"
          data-sap-ui-language="pt"
          data-sap-ui-compat-version="edge"
          data-sap-ui-async="true">
  </script>

  <style>
    /* Popover do Driver.js com a cara do tema Horizon (usa as variáveis CSS do UI5) */
    .ui5-tour.driver-popover {
      font-family: var(--sapFontFamily);
      color: var(--sapTextColor);
      background: var(--sapGroup_ContentBackground);
      border-radius: var(--sapElement_BorderCornerRadius, 0.75rem);
      box-shadow: var(--sapContent_Shadow2);
      max-width: 22rem;
    }
    .ui5-tour .driver-popover-title {
      font-family: var(--sapFontHeaderFamily, var(--sapFontFamily));
      font-size: var(--sapFontHeader5Size);
      font-weight: bold;
    }
    .ui5-tour .driver-popover-description { font-size: var(--sapFontSize); line-height: 1.45; }
    .ui5-tour .driver-popover-progress-text { color: var(--sapContent_LabelColor); }
    .ui5-tour .driver-popover-footer button {
      font-family: var(--sapFontFamily);
      text-shadow: none;
      border-radius: var(--sapButton_BorderCornerRadius);
      border: 1px solid var(--sapButton_BorderColor);
      background: var(--sapButton_Background);
      color: var(--sapButton_TextColor);
      padding: 0.35rem 0.75rem;
    }
    .ui5-tour .driver-popover-footer .driver-popover-next-btn {
      background: var(--sapButton_Emphasized_Background);
      border-color: var(--sapButton_Emphasized_BorderColor);
      color: var(--sapButton_Emphasized_TextColor);
    }
    .ui5-tour .driver-popover-arrow-side-left.driver-popover-arrow  { border-left-color:  var(--sapGroup_ContentBackground); }
    .ui5-tour .driver-popover-arrow-side-right.driver-popover-arrow { border-right-color: var(--sapGroup_ContentBackground); }
    .ui5-tour .driver-popover-arrow-side-top.driver-popover-arrow   { border-top-color:   var(--sapGroup_ContentBackground); }
    .ui5-tour .driver-popover-arrow-side-bottom.driver-popover-arrow{ border-bottom-color:var(--sapGroup_ContentBackground); }
  </style>

  <script>
    // Versão atual do app. Em um app real, leia de manifest.json (sap.app/applicationVersion/version).
    const APP_VERSION = "1.1.0";
    const STORAGE_KEY = "helloUi5.lastSeenVersion";

    // Em produção no Fiori Launchpad, troque por Personalization Service ou tabela Z no backend,
    // para que a versão vista acompanhe o usuário em qualquer navegador.
    function getLastSeenVersion() {
      try { return localStorage.getItem(STORAGE_KEY); } catch (e) { return null; }
    }
    function setLastSeenVersion(v) {
      try { localStorage.setItem(STORAGE_KEY, v); } catch (e) { /* ignora */ }
    }

    function startTour() {
      const driver = window.driver.js.driver;
      const tour = driver({
        showProgress: true,
        allowClose: true,
        popoverClass: "ui5-tour",
        progressText: "{{current}} de {{total}}",
        nextBtnText: "Próximo",
        prevBtnText: "Anterior",
        doneBtnText: "Entendi",
        onDestroyed: () => setLastSeenVersion(APP_VERSION),
        steps: [
          {
            popover: {
              title: "Novidades da versão " + APP_VERSION,
              description: "Fizemos algumas melhorias nesta tela. Leva menos de um minuto para conhecer."
            }
          },
          {
            element: "#inpNome",
            popover: {
              title: "Campo de nome",
              description: "Agora o campo de nome é obrigatório e aceita até 40 caracteres.",
              side: "bottom", align: "start"
            }
          },
          {
            element: "#btnSaudar",
            popover: {
              title: "Botão “Dizer olá”",
              description: "Mudou de lugar: antes ficava no rodapé, agora fica ao lado do campo.",
              side: "bottom", align: "start"
            }
          },
          {
            element: "#btnExportar",
            popover: {
              title: "Novo: exportar",
              description: "Gere um comprovante da saudação em um clique.",
              side: "top", align: "end"
            }
          },
          {
            element: "#btnNovidades",
            popover: {
              title: "Reveja quando quiser",
              description: "Este botão abre o tour de novidades de novo.",
              side: "bottom", align: "end"
            }
          }
        ]
      });
      tour.drive();
    }

    sap.ui.require([
      "sap/ui/core/Core", "sap/m/App", "sap/m/Page", "sap/m/Title", "sap/m/Text", "sap/m/Label",
      "sap/m/Input", "sap/m/Button", "sap/m/HBox", "sap/m/VBox", "sap/m/Toolbar",
      "sap/m/ToolbarSpacer", "sap/m/MessageToast", "sap/m/ObjectStatus"
    ], async function (Core, App, Page, Title, Text, Label, Input, Button, HBox, VBox,
                       Toolbar, ToolbarSpacer, MessageToast, ObjectStatus) {
      await Core.ready();

      const oInput = new Input("inpNome", {
        placeholder: "Digite seu nome",
        required: true,
        maxLength: 40,
        width: "16rem"
      });

      const oPage = new Page("pagina", {
        title: "Hello World",
        headerContent: [
          new Button("btnNovidades", {
            icon: "sap-icon://hint",
            text: "O que há de novo",
            type: "Transparent",
            press: startTour
          })
        ],
        content: [
          new VBox({
            items: [
              new Title({ text: "Olá, mundo!", level: "H2", titleStyle: "H2" }),
              new Text({ text: "Exemplo de app OpenUI5 com tour de novidades usando Driver.js." })
                .addStyleClass("sapUiSmallMarginBottom"),
              new Label({ text: "Nome", labelFor: "inpNome", required: true }),
              new HBox({
                alignItems: "Center",
                items: [
                  oInput,
                  new Button("btnSaudar", {
                    text: "Dizer olá",
                    type: "Emphasized",
                    press: function () {
                      const sNome = oInput.getValue().trim();
                      if (!sNome) {
                        oInput.setValueState("Error").setValueStateText("Informe seu nome para continuar.");
                        return;
                      }
                      oInput.setValueState("None");
                      MessageToast.show("Olá, " + sNome + "!");
                    }
                  }).addStyleClass("sapUiTinyMarginBegin")
                ]
              }),
              new ObjectStatus({ text: "Versão " + APP_VERSION, state: "Information" })
                .addStyleClass("sapUiMediumMarginTop")
            ]
          }).addStyleClass("sapUiMediumMargin")
        ],
        footer: new Toolbar({
          content: [
            new Button({
              text: "Resetar tour (teste)",
              type: "Transparent",
              press: function () {
                try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* ignora */ }
                MessageToast.show("Pronto. Recarregue a página para ver o tour automático.");
              }
            }),
            new ToolbarSpacer(),
            new Button("btnExportar", {
              text: "Exportar",
              icon: "sap-icon://download",
              press: () => MessageToast.show("Exportado.")
            })
          ]
        })
      });

      // Abre o tour automaticamente só na primeira visita após uma nova versão
      let bTourChecked = false;
      oPage.addEventDelegate({
        onAfterRendering: function () {
          if (bTourChecked) { return; }
          bTourChecked = true;
          if (getLastSeenVersion() !== APP_VERSION) {
            setTimeout(startTour, 400);
          }
        }
      });

      new App({ pages: [oPage] }).placeAt("content");
    });
  </script>
</head>
<body class="sapUiBody" id="content"></body>
</html>
